<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | HealBite</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="ADDEDIT-navbar">
    <div class="ADDEDIT-nav-left">
      <a class="ADDEDIT-brand" href="home.html" aria-label="HealBite Home">
        <img src="logo.PNG" alt="HealBite logo" class="ADDEDIT-logo" />
        <span class="ADDEDIT-brand-text">HEAL<span class="ADDEDIT-brand-accent">BITE</span></span>
      </a>
    </div>

    <nav class="ADDEDIT-nav-right">
      <a class="ADDEDIT-link" href="home.html">Home</a>
      <a class="ADDEDIT-btn ADDEDIT-btn-outline" href="login.html">Log in</a>
      </a>
    </nav>
  </header>

<main>
  <section class="signup-section">
    <h2>Create an Account</h2>
    <form action="#" method="POST" class="signup-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required placeholder="Enter your full name">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="Enter your email">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required placeholder="Enter your password">

      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirm your password">

      <button type="button" class="btn-signup" onclick="location.href='Userpage.html'">Sign Up</button>
      <p class="login-prompt">Already have an account? <a href="login.html">Log in</a></p>
    </form>
  </section>
</main>

<footer>
  <div class="footer-logo">
    <img src="logo.png" alt="Healbite Logo" class="footer-logo-img">
  </div>
  <div class="footer-info">
    <span>Twitter | Instagram</span>
    <span>+966 50#######</span>
    <span><a href="mailto:info@healbite.com">info@healbite.com</a></span>
    <span>&copy; 2026 Healbite - All rights reserved.</span>
  </div>
</footer>

<script src="js/theme.js"></script>

</body>
</html>
